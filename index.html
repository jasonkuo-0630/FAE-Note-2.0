<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="產品知識、操作流程、實測結果與問題排查的 FAE 工作知識庫。"
    />
    <title>FAE Notes 2.0</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主要導覽">
        <div class="brand">
          <button
            class="brand-button"
            id="brandHomeButton"
            type="button"
            aria-label="回到首頁"
          >
            <span class="brand-mark" aria-hidden="true">
              <span class="brand-mark-dot"></span>
            </span>
            <span>
              <strong>FAE Notes</strong>
              <small>WORK KNOWLEDGE BASE · 2.0</small>
            </span>
          </button>
        </div>

        <nav class="sidebar-nav" id="sidebarNav"></nav>

        <div class="sidebar-footer">
          <div class="health-row">
            <span class="health-dot" id="healthDot"></span>
            <span id="healthText">資料健檢中</span>
          </div>
          <span id="sidebarNoteCount">0 篇筆記</span>
        </div>
      </aside>

      <button
        class="sidebar-backdrop"
        id="sidebarBackdrop"
        type="button"
        aria-label="關閉導覽"
      ></button>

      <main class="main">
        <header class="topbar">
          <div class="topbar-primary">
            <button
              class="icon-button menu-button"
              id="menuButton"
              type="button"
              aria-label="開啟導覽"
              aria-expanded="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" />
              </svg>
            </button>

            <label class="search-box" for="searchInput">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-4-4" />
              </svg>
              <input
                id="searchInput"
                type="search"
                placeholder="搜尋標題、內容、設備、版本或標籤…"
                autocomplete="off"
              />
              <kbd>/</kbd>
            </label>

            <div class="topbar-actions">
              <button
                class="icon-button"
                id="themeButton"
                type="button"
                aria-label="切換深淺色模式"
                title="切換深淺色模式"
              ></button>
            </div>
          </div>

          <div class="filter-stack">
            <div class="filter-row" aria-label="筆記類型篩選">
              <span class="filter-label">類型</span>
              <div class="filter-pills" id="typeFilters"></div>
            </div>
            <div class="filter-row" aria-label="筆記狀態篩選">
              <span class="filter-label">狀態</span>
              <div class="filter-pills" id="statusFilters"></div>
            </div>
          </div>
        </header>

        <div class="content-scroll" id="contentScroll">
          <div class="content" id="content" aria-live="polite"></div>
        </div>
      </main>
    </div>

    <script src="data/config.js"></script>
    <script src="data/areas.js"></script>
    <script src="data/taxonomy.js"></script>
    <script src="data/sources.js"></script>
    <script src="data/notes/gv-vms/vms-ip-device-setup.js"></script>
    <script src="data/notes/gv-vms/vms-live-view-layout.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/search.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
